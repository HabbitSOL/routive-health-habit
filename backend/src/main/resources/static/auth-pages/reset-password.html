<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>루티브 비밀번호 재설정</title>
<link rel="stylesheet" href="/auth-pages/account.css">
<script src="/auth-pages/account.js" defer></script>
</head>
<body><main data-action="reset">
<p class="brand">루티브</p><h1>비밀번호 재설정</h1>
<p>새 비밀번호를 입력하세요. 변경하면 다른 기기에서도 로그아웃됩니다.</p>
<form>
<label for="password">새 비밀번호</label>
<input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
<label for="confirm">새 비밀번호 확인</label>
<input id="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
<button type="submit">비밀번호 변경</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<p class="hint">8자 이상 입력하세요. 한글 등 다국어를 포함하면 입력 가능한 길이가 달라집니다.</p>
</main></body></html>
